[i18n]
default_locale = "en"

[i18n.locales.en]
direction = "ltr"

[i18n.locales.de]
direction = "ltr"

[site]
base_path = "/my-project/"

[build]
output_dir = "public/my-project"

[assets]
integrity = "sha384"

[collections.posts]
order = "date-desc"

[taxonomies.tags]
collection = "posts"
path = "tags"
index_template = "taxonomy-index.tera"
term_template = "taxonomy-term.tera"
per_page = 10

[markdown]
math = "mathml"

[markdown.highlighting]
stylesheet = "css/highlighting.css"

[markdown.highlighting.theme]
light = "github-light-default"
dark = "ayu-dark"
