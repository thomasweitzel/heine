[i18n]
default_locale = "en"

[i18n.locales.en]
direction = "ltr"

[i18n.locales.de]
direction = "ltr"

[site]
base_path = "/my-project/"
origin = "https://example.org"
time_zone = "Europe/Berlin"

[sitemap]

[build]
output_dir = "public/my-project"

[assets]
integrity = "sha384"

[collections.posts]
order = "published-desc"

[taxonomies.tags]
collection = "posts"
path = "tags"
index_template = "taxonomy-index.tera"
term_template = "taxonomy-term.tera"
per_page = 10

[taxonomies.tags.translations.rust]
en = "Rust"
de = "Rust"

[taxonomies.tags.translations.static-sites]
en = "Static sites"
de = "Statische Seiten"

[markdown]
math = "mathml"

[markdown.highlighting]
stylesheet = "css/highlighting.css"

[markdown.highlighting.theme]
light = "github-light-default"
dark = "ayu-dark"
