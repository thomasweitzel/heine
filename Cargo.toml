[package]
name = "heine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
tera = { version = "2.2.0", features = ["glob_fs"] }
walkdir = "2.5.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
pulldown-latex = "0.8.0"
giallo = { version = "0.5.2", features = ["dump"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
base64 = "0.23.1"
sha2 = "0.11.0"
axum = "0.8.9"
mime_guess = "2.0.5"
notify = "8.2.0"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
