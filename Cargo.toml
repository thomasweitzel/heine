[package]
name = "heine"
version = "0.2.2"
edition = "2024"
license = "EUPL-1.2"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.5"
tera = { version = "2.3.0", features = ["glob_fs"] }
walkdir = "2.5.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
html5ever = "0.39.0"
pulldown-latex = "0.8.0"
giallo = { version = "0.5.2", features = ["dump"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
base64 = "0.23.1"
sha2 = "0.11.0"
axum = "0.8.9"
mime_guess = "2.0.5"
notify = "8.2.0"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
unicode-normalization = "0.1.25"
icu_datetime = { version = "2.3.0", features = ["compiled_data"] }
icu_calendar = "2.3.0"
icu_locale = "2.3.1"
icu_collator = { version = "2.3.1", features = ["compiled_data"] }
spdx = "0.13.5"
jiff = { version = "0.2.35", features = ["tzdb-bundle-always"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
