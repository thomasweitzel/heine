[package]
name = "heine"
version = "0.10.1"
edition = "2024"
rust-version = "1.88"
description = "A small, checked static-site generator"
repository = "https://github.com/thomasweitzel/heine/"
homepage = "https://heine.rs/"
readme = "README.md"
license = "EUPL-1.2+"
keywords = ["static-site-generator", "ssg", "markdown", "website"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
tera = { version = "2.4.0", features = ["glob_fs"] }
walkdir = "2.5.0"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
html5ever = "0.40.1"
pulldown-latex = "0.8.0"
giallo = { version = "0.5.2", features = ["dump"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
base64 = "0.23.1"
sha2 = "0.11.1"
quick-xml = "0.42.0"
tempfile = "3.27.0"
axum = "0.8.9"
mime_guess = "2.0.5"
mime = "0.3.17"
notify = "8.2.1"
percent-encoding = "2.3.2"
tokio = { version = "1.54.1", features = ["fs", "io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
fixed_decimal = { version = "0.7.3", features = ["ryu"] }
intl-memoizer = "0.5.3"
unic-langid = "0.9.6"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
icu_datetime = { version = "2.4.0", features = ["compiled_data"] }
icu_decimal = { version = "2.4.0", features = ["compiled_data"] }
icu_calendar = "2.4.0"
icu_locale = "2.4.0"
icu_collator = { version = "2.4.0", features = ["compiled_data"] }
spdx = "0.13.6"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
url = "2.5.8"
biblatex = "0.12.0"
hayagriva = { version = "0.10.1", features = ["archive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 3         # all optimizations
lto = true            # link-time optimization, fat LTO
codegen-units = 1     # slower compile, better optimization/size
panic = "abort"       # removes unwinding tables/landing pads
strip = true          # strips symbols and debug info automatically
